# fly.toml app configuration file generated for workweave on 2026-10-16T22:07:41Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'workweave'
primary_region = 'ams'
kill_signal = 'SIGTERM'
kill_timeout = '30s'

[build]
  dockerfile = 'Dockerfile'

[env]
  WORKWEAVE_ALLOWED_HOSTS = '["localhost","127.0.0.1","*.fly.dev"]'
  WORKWEAVE_ALLOW_PRIVATE_DRIVE = 'false'
  WORKWEAVE_DATA_DIR = '/data/workweave'
  WORKWEAVE_GRAPH_TLS = 'true'
  WORKWEAVE_OLLAMA_CLOUD_MODEL = 'gemma4:31b'
  WORKWEAVE_SECURE_COOKIES = 'true'

[[mounts]]
  source = 'workweave_data'
  destination = '/data/workweave'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/api/v1/health'

    [http_service.checks.headers]
      Host = 'localhost'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
