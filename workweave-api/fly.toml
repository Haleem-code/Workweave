# Fly's GitHub launcher supplies the app name and region.
# Working directory: workweave-api / Config path: fly.toml

kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  WORKWEAVE_DATA_DIR = "/data/workweave"
  WORKWEAVE_SECURE_COOKIES = "true"
  WORKWEAVE_ALLOWED_HOSTS = '["localhost","127.0.0.1","*.fly.dev"]'
  WORKWEAVE_GRAPH_TLS = "true"
  WORKWEAVE_OLLAMA_CLOUD_MODEL = "gemma4:31b"
  WORKWEAVE_ALLOW_PRIVATE_DRIVE = "false"

[http_service]
  internal_port = 8000
  force_https = true
  # Investigations continue in the background after an HTTP request ends.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/v1/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    [http_service.checks.headers]
      Host = "localhost"

[mounts]
  source = "workweave_data"
  destination = "/data/workweave"
  initial_size = "1gb"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
