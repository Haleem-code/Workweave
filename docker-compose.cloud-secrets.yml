# Optional file-based password; combine this with docker-compose.cloud.yml.
services:
  api:
    environment:
      WORKWEAVE_GRAPH_PASSWORD_FILE: /run/secrets/falkordb_password
    secrets: [falkordb_password]
secrets:
  falkordb_password:
    file: ${WORKWEAVE_GRAPH_PASSWORD_FILE_HOST:?Set WORKWEAVE_GRAPH_PASSWORD_FILE_HOST to your password file path}
